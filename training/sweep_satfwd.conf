#!/usr/bin/env bash
# ============================================================================
# sweep_satfwd.conf — "satellite + forward-only" ablation sweep.
#
#   bash training/launch_sweep.sh --config training/sweep_satfwd.conf
#
# Same machinery as sweep.conf (MODELS × RANKS × CONDITIONS, chained on 1 GPU),
# but with two extra env vars forwarded to every job (EXTRA_ENV below):
#
#   SV_ANGLES=along_fwd        for the 8 urban satellite_marked tasks, feed only
#                              the marked satellite + the FORWARD street-view
#                              image (instead of all 4 SV angles). Non-urban
#                              modes (camera_direction, mismatch_*) are untouched
#                              — the gate lives in data.py and only affects
#                              satellite_marked.
#   EXCLUDE_TOPICS=green_space drop green_space from TRAIN (eval keeps it, so its
#                              frozen baseline is still visible per-topic).
#
# Motivation: Phase-2 attention-prune found the forward camera is the one
# street-view image carrying the urban-attribute answer. This trains a model
# under that constraint and benchmarks it against the full-SV runs.
#
# Scope vs sweep.conf: ONE run — r16, seen_unseen only. The two prior full-SV
# 9B runs already covered r16/r32 × conditions; this is the matched sat+fwd arm.
# ============================================================================

# Distinct prefix so run-dirs / eval-keys never collide with the full-SV sweep:
#   mm_qwen9b_satfwd_r16_seen_unseen
SWEEP_NAME="qwen9b_satfwd"

# --- MODELS -----------------------------------------------------------------
#   KEY | BASE_MODEL | FAMILY | DISPLAY
MODELS=(
    "qwen9b|Qwen/Qwen3.5-9B|qwen|Qwen3.5-9B"
)

# --- RANKS ------------------------------------------------------------------
#   R | ALPHA | LR   (single rank: r16, matches the full-SV r16 arm for compare)
RANKS=(
    "16|16|1.5e-4"
)

# --- CONDITIONS -------------------------------------------------------------
#   KEY | SPLIT_STRATEGY | TEXT_ONLY   (seen_unseen only — the cross-city test)
CONDITIONS=(
    "seen_unseen|splits_seen_unseen|0"
)

# --- EPOCHS (per-model) -----------------------------------------------------
EPOCHS_DEFAULT=4
declare -A EPOCHS=()

# --- THE ABLATION: extra env forwarded to every job -------------------------
# SKIP_PROBE + BATCH_SIZE: pin bs=56, the measured max from the standalone probe
# (test_bs.py on Qwen3.5-9B, 5-image worst case): bs=56 peaks at 93.6 GB = 96%
# of the 96 GB card (bs=64 OOMs). Pinning skips the ~15-min probe and is
# reproducible. Headroom is tight (~2.5 GB) so we rely on expandable_segments
# (set by train.py) to keep fragmentation in check across the 4-epoch run.
EXTRA_ENV=(
    "SV_ANGLES=along_fwd"
    "EXCLUDE_TOPICS=green_space"
    "SKIP_PROBE=1"
    "BATCH_SIZE=56"
)

# --- SHARED TRAINING KNOBS (identical to sweep.conf) ------------------------
IMAGE_MAX_EDGE=512
OPTIM=adamw_8bit
LR_SCHEDULER=cosine
WARMUP_STEPS=100
WEIGHT_DECAY=0.01
SAVE_MERGED=0
SEED=3407
EARLY_STOPPING=1
REPORT_TO=none
GPU_PROFILE=rtx_pro_6000_96gb

# --- GPU FILL TARGET (identical to sweep.conf) ------------------------------
PROBE_TARGET_HIGH=0.98
PROBE_TARGET_LOW=0.94
PROBE_RESERVE_MB=1536
PROBE_FLAT_MARGIN=0.0
PROBE_HARD_CAP=128

# --- BENCHMARK --------------------------------------------------------------
# OFF — this is a training run, not a benchmark sweep. The pipeline runs
# train -> full-val eval only; no EzelinyumEvaluator harness, no 3-mode
# (sat+stv4 / sat_only / stv_only) comparison.
BENCHMARK=0
