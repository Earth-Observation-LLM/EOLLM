#!/usr/bin/env bash
# ============================================================================
# sweep_satfwd_percity.conf — "satellite + forward-only" ablation, PER-CITY split.
#
#   bash training/launch_sweep.sh --config training/sweep_satfwd_percity.conf
#
# Matched per-city arm of sweep_satfwd.conf. The seen_unseen run
# (mm_qwen9b_satfwd_r16_seen_unseen) trained the same recipe on the cross-city
# splits_seen_unseen split and reached 75.2% val (base 42.0%). This run is the
# IN-DISTRIBUTION (per-city) counterpart — same model, same LoRA, same SV-angle
# gate, same green_space exclusion — only SPLIT_STRATEGY differs. Together the
# two splits isolate generalization (per-city = train/test cities overlap;
# seen_unseen = held-out cities).
#
# EXTRA_ENV gate (identical intent to the seen_unseen run):
#   SV_ANGLES=along_fwd        satellite_marked urban tasks feed marked-satellite
#                              + FORWARD street-view only (2 images), not all 4
#                              SV angles. Non-urban modes (camera_direction,
#                              mismatch_*) untouched — gate lives in data.py.
#   EXCLUDE_TOPICS=green_space drop green_space from TRAIN (eval keeps it).
#
# DELTA vs sweep_satfwd.conf (the only intentional differences):
#   1. CONDITIONS: per_city  (was seen_unseen)
#   2. SWEEP_NAME: qwen9b_satfwd_percity  -> run dir mm_qwen9b_satfwd_percity_r16_per_city
#   3. BATCH_SIZE=64 (was 56) + LR 1.6e-4 (was 1.5e-4)
#
#      Batch bump is safe because this is a 2-image (sat+fwd) run, NOT the
#      5-image worst case the original bs=56 pin was sized for. The completed
#      seen_unseen run measured PEAK VRAM = 70.6 GB at bs=56 on the 96 GB card
#      (86% of the 80 GB it reports; ~25 GB headroom). Scaling activations
#      ~linearly: 70.6 * 64/56 ≈ 80.7 GB at bs=64 — comfortably under 96 GB.
#      LR scaled by sqrt(64/56)=1.069 (AdamW/LoRA convention): 1.5e-4 -> 1.6e-4.
#      Steps/epoch 25420/64 = 398 -> ~1592 total over 4 epochs (was 1816).
# ============================================================================

# Distinct prefix so run-dirs / eval-keys never collide with the seen_unseen arm:
#   mm_qwen9b_satfwd_percity_r16_per_city
SWEEP_NAME="qwen9b_satfwd_percity"

# --- MODELS -----------------------------------------------------------------
#   KEY | BASE_MODEL | FAMILY | DISPLAY
MODELS=(
    "qwen9b|Qwen/Qwen3.5-9B|qwen|Qwen3.5-9B"
)

# --- RANKS ------------------------------------------------------------------
#   R | ALPHA | LR   (r16; LR sqrt-scaled for bs=64: 1.5e-4 -> 1.6e-4)
RANKS=(
    "16|16|1.6e-4"
)

# --- CONDITIONS -------------------------------------------------------------
#   KEY | SPLIT_STRATEGY | TEXT_ONLY   (per_city — the in-distribution arm)
CONDITIONS=(
    "per_city|splits_per_city|0"
)

# --- EPOCHS (per-model) -----------------------------------------------------
EPOCHS_DEFAULT=4
declare -A EPOCHS=()

# --- THE ABLATION: extra env forwarded to every job -------------------------
# SKIP_PROBE + BATCH_SIZE: pin bs=64 (see header math). Skips the ~15-min probe
# and is reproducible. Headroom ~15 GB on the 96 GB card for the 2-image run.
EXTRA_ENV=(
    "SV_ANGLES=along_fwd"
    "EXCLUDE_TOPICS=green_space"
    "SKIP_PROBE=1"
    "BATCH_SIZE=64"
)

# --- SHARED TRAINING KNOBS (identical to sweep_satfwd.conf) ------------------
IMAGE_MAX_EDGE=512
OPTIM=adamw_8bit
LR_SCHEDULER=cosine
WARMUP_STEPS=100
WEIGHT_DECAY=0.01
SAVE_MERGED=0
SEED=3407
EARLY_STOPPING=1
REPORT_TO=none
GPU_PROFILE=rtx_pro_6000_96gb

# --- GPU FILL TARGET (identical to sweep_satfwd.conf) -----------------------
PROBE_TARGET_HIGH=0.98
PROBE_TARGET_LOW=0.94
PROBE_RESERVE_MB=1536
PROBE_FLAT_MARGIN=0.0
PROBE_HARD_CAP=128

# --- BENCHMARK --------------------------------------------------------------
# OFF — training run, not a benchmark sweep. train -> full-val eval only.
BENCHMARK=0
