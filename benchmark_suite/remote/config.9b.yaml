# config.9b.yaml — lab-ws (vLLM). The two trained 9B models (per-city &
# seen_unseen), each evaluated on (a) its OWN validation split and (b) the shared
# held-out benchmark. Run by remote/submit.slurm with CONFIG=remote/config.9b.yaml.
#
# WHY merged bf16 (not LoRA-in-vLLM): both adapters target the VISION tower as
# well as the language model; vLLM's experimental multimodal-LoRA path does not
# reliably apply vision-tower LoRA, which would silently drop trained weights.
# So we merge each adapter into standalone bf16 (merge_adapter.py) and serve the
# merged dir as a plain vLLM model.
#
# image_max_edge = 512: these adapters were TRAINED at 512px (forced for the
# multi-model sweep; see training/run_one_model.slurm IMAGE_MAX_EDGE=512 and the
# run's token_budget.md). Eval MUST match the trained edge or the model sees a
# resolution it never trained on. Do not change without re-checking training.
#
# Datasets all live under EODATA_compressed_final/ (verified: image_mode set on
# every record, image paths resolve, format matches images.build_images). The
# OTHER benchmark copy at EarthMLLMEval/data/ has image_mode=None and must NOT be
# used here — it would mis-dispatch every record to satellite_only.

defaults:
  modes: [blind, sv_only, sat_only, full]   # canonical order; auto-pruned per topic
  enable_thinking: false
  image_max_edge: 512
  max_model_len: 16384
  max_num_seqs: 64           # fallback only; SLURM probe exports SUITE_MAX_NUM_SEQS
  gpu_mem_util: 0.98         # 2% headroom; SUITE_GPU_MEM_UTIL env can override
  seed: 3407

models:
  # ---- per-city model: its own val split + the benchmark --------------------
  - key: qwen9b_per_city
    display: "Qwen3.5-9B per-city (merged ep4 / ckpt-2912)"
    hf_id: /home/ain480/training/training/runs/mm_qwen9b_r16_per_city/merged_ep4
    family: qwen
    backend: vllm
    attention: false
    dataset:
      - tag: percity_val
        path: /home/ain480/training/dataset_content/EODATA_compressed_final/splits_per_city/validation.jsonl
        image_root: /home/ain480/training/dataset_content/EODATA_compressed_final/splits_per_city
      - tag: benchmark
        path: /home/ain480/training/dataset_content/EODATA_compressed_final/benchmark/benchmark_with_answers.jsonl
        image_root: /home/ain480/training/dataset_content/EODATA_compressed_final/benchmark

  # ---- seen/unseen model: its own val split + the benchmark -----------------
  - key: qwen9b_seen_unseen
    display: "Qwen3.5-9B seen/unseen (merged ep4 / ckpt-2248)"
    hf_id: /home/ain480/training/training/runs/mm_qwen9b_r16_seen_unseen/merged_ep4
    family: qwen
    backend: vllm
    attention: false
    dataset:
      - tag: seen_unseen_val
        path: /home/ain480/training/dataset_content/EODATA_compressed_final/splits_seen_unseen/validation.jsonl
        image_root: /home/ain480/training/dataset_content/EODATA_compressed_final/splits_seen_unseen
      - tag: benchmark
        path: /home/ain480/training/dataset_content/EODATA_compressed_final/benchmark/benchmark_with_answers.jsonl
        image_root: /home/ain480/training/dataset_content/EODATA_compressed_final/benchmark
